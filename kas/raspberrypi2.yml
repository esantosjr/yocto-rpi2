# Run from the project root:
# KAS_BUILD_DIR=build-kas kas build kas/raspberrypi2.yml
header:
  version: 14

machine: raspberrypi2
distro: poky
target: core-image-base

repos:
  poky:
    url: https://git.yoctoproject.org/poky
    path: poky
    branch: scarthgap
    commit: 6b7c1066f778db5a6b3e35400617b10342988fa8
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi.git
    path: meta-raspberrypi
    branch: scarthgap
    commit: 018d44467c4f09eb63f8ea5e86e85d755250cf89
    layers:
      .:

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""

local_conf_header:
  base: |
    CONF_VERSION = "2"
    PATCHRESOLVE = "noop"
  development: |
    # Development only: permit root SSH login without a password.
    EXTRA_IMAGE_FEATURES = "debug-tweaks ssh-server-dropbear"
  downloads: |
    # Work around the IPv6 download failures observed on this host.
    FETCHCMD_wget = "/usr/bin/env wget -4 -t 2 -T 100"
    INHERIT += "own-mirrors"
    SOURCE_MIRROR_URL = "https://downloads.yoctoproject.org/mirror/sources/"
